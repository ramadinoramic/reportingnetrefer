# Maps Netrefer CSV column headers → MySQL column names.
# Handles the sep= header and blank rows automatically in the parser.

column_map:
  # Affiliate identity
  "Affiliate ID":                     affiliate_id
  "Affiliate Name":                   affiliate_name
  "Affiliate Email":                  affiliate_email
  "Affiliate Status":                 affiliate_status
  "Affiliate Signup Date":            affiliate_signup_date

  # Campaign / plan
  "Default Marketing Source Name":    campaign_name
  "Default Marketing Source Category": media_type
  "Reward Plan ID":                   reward_plan_id
  "Reward Plan":                      reward_plan
  "Country":                          country

  # Traffic
  "Views":                            views
  "Unique Views":                     unique_views
  "Clicks":                           clicks
  "Unique Clicks":                    unique_clicks

  # Conversions
  "Customer Signups":                 registrations
  "Depositing Customers":             depositing_customers
  "Active Customers":                 active_customers
  "New Depositing Customers":         new_depositing_customers
  "New Active Customers":             new_active_customers
  "First Time Depositing Customers":  first_depositors
  "First Time Active Customers":      first_active_customers
  "Transactions":                     transactions

  # Financials
  "Deposits":                         deposits
  "Turnover":                         turnover
  "Contributions":                    contributions
  "Payouts":                          payouts
  "Gross Revenue":                    gross_revenue
  "Bonuses":                          bonuses
  "Adj (General)":                    adj_general
  "Adj (Chargebacks)":                chargebacks
  "Net Revenue":                      net_revenue

  # Rewards / commission
  "Number Of Sub-Affiliates":         sub_affiliates
  "Revenue Share Reward":             rev_share_reward
  "CPA Reward":                       cpa_reward
  "Sub-Affiliate Reward":             sub_affiliate_reward
  "Other Rewards":                    other_rewards
  "Total Reward":                     total_reward
